---
- name: Creer le compte d'administration
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    password: '!'

- name: Deposer la cle publique
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_pubkey }}"
    exclusive: true

- name: Autoriser sudo sans mot de passe, et le tracer
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/10-{{ admin_user }}"
    content: |
      Defaults:{{ admin_user }} log_output
      Defaults:{{ admin_user }} logfile="/var/log/sudo-{{ admin_user }}.log"
      {{ admin_user }} ALL=(ALL) NOPASSWD:ALL
    owner: root
    group: root
    mode: '0440'
    validate: 'visudo -cf %s'
