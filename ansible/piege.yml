---
- name: Le piege numero un
  hosts: app
  become: true
  tasks:
    - name: Sans creates, toujours changed
      ansible.builtin.command:
        cmd: touch /tmp/marqueur

    - name: Avec creates, changed une seule fois
      ansible.builtin.command:
        cmd: touch /tmp/marqueur2
        creates: /tmp/marqueur2
